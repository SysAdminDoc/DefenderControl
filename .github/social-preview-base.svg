<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">DefenderControl</title>
  <desc id="desc">Controlled Microsoft Defender maintenance with dry run, status, scheduled restore, and an audit trail.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c18"/>
      <stop offset="0.58" stop-color="#111a31"/>
      <stop offset="1" stop-color="#17264a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.72">
      <stop offset="0" stop-color="#287dd8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#287dd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#02040a" flood-opacity="0.58"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <path d="M0 532 C226 466 406 492 614 640 H0 Z" fill="#2dd47a" opacity="0.035"/>
  <path d="M0 0 H600 C504 86 404 111 294 112 C164 113 80 78 0 28 Z" fill="#4da3ff" opacity="0.045"/>

  <text x="156" y="82" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700">DefenderControl</text>
  <text x="157" y="108" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Windows 10 and 11 | PowerShell 5.1</text>

  <text x="70" y="179" fill="#63b3ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">CONTROLLED DEFENDER MAINTENANCE</text>
  <text x="68" y="245" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="760">A safer way to step</text>
  <text x="68" y="299" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="760">protection aside.</text>
  <text x="70" y="348" fill="#b8c4d8" font-family="Segoe UI, Arial, sans-serif" font-size="19">Inspect first. Make a controlled change.</text>
  <text x="70" y="378" fill="#b8c4d8" font-family="Segoe UI, Arial, sans-serif" font-size="19">Keep a clear path back to the prior state.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="70" y="430" width="150" height="42" rx="21" fill="#192743" stroke="#35527d"/>
    <circle cx="94" cy="451" r="6" fill="#63b3ff"/>
    <text x="110" y="456" fill="#e8eef8">Dry run first</text>

    <rect x="232" y="430" width="184" height="42" rx="21" fill="#192743" stroke="#35527d"/>
    <circle cx="256" cy="451" r="6" fill="#2dd47a"/>
    <text x="272" y="456" fill="#e8eef8">Firewall untouched</text>

    <rect x="70" y="484" width="184" height="42" rx="21" fill="#192743" stroke="#35527d"/>
    <circle cx="94" cy="505" r="6" fill="#2dd47a"/>
    <text x="110" y="510" fill="#e8eef8">Scheduled restore</text>

    <rect x="266" y="484" width="145" height="42" rx="21" fill="#192743" stroke="#35527d"/>
    <circle cx="290" cy="505" r="6" fill="#ffb454"/>
    <text x="306" y="510" fill="#e8eef8">Audit trail</text>
  </g>

  <text x="70" y="582" fill="#718096" font-family="Segoe UI, Arial, sans-serif" font-size="14">Portable | Open source | Built for administrators and test labs</text>

  <rect x="686" y="34" width="562" height="588" rx="24" fill="#050914" opacity="0.5" filter="url(#shadow)"/>
  <rect x="694" y="42" width="546" height="572" rx="18" fill="none" stroke="#3f5f92" stroke-width="2"/>
</svg>
